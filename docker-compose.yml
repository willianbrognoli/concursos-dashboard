# Referência para rodar fora do Easypanel (docker compose up -d --build)
services:
  concursos-dashboard:
    build: .
    container_name: concursos-dashboard
    restart: unless-stopped
    ports:
      - "8010:8000"
    environment:
      SECRET_KEY: "troque-por-uma-chave-longa-e-aleatoria"
      ADMIN_EMAIL: "emanuel@fauthefreitas.adv.br"
      OPEN_REGISTRATION: "true"
      SCRAPE_HOUR: "6"
      SCRAPE_ON_START: "true"
      TZ: America/Sao_Paulo
      # API de sincronização (ver API.md)
      API_KEYS: "gere-uma-chave-longa"      # várias: separe por vírgula
      WEBHOOK_URLS: ""                       # opcional: URL do sistema parceiro
      WEBHOOK_SECRET: "gere-um-segredo"      # assina o aviso do webhook
    volumes:
      - concursos_data:/data

volumes:
  concursos_data:
